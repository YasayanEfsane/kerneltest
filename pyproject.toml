[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-clock-benchmark"
version = "1.0.0"
description = "Safe evidence-capsule benchmark for Windows kernel reverse-engineering analysis"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Obsidian Clock contributors" }]

[tool.setuptools.packages.find]
include = ["answer*"]
